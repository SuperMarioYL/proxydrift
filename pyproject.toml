[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "proxydrift"
version = "0.1.0"
description = "检测 AI Agent 代理指标与真实业务结果背离的审计工具 — audit CLI that flags agents improving the proxy while real outcomes sink"
authors = [{ name = "SuperMarioYL", email = "leo.stack@outlook.com" }]
license = "MIT"
requires-python = ">=3.12"
keywords = ["agent", "agent-eval", "reward-hacking", "metric-gaming", "llm-ops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pandas>=2.2",
    "matplotlib>=3.9",
    "httpx>=0.27",
]

[project.scripts]
proxydrift = "proxydrift.cli:main"

[project.urls]
Homepage = "https://github.com/SuperMarioYL/proxydrift"
Repository = "https://github.com/SuperMarioYL/proxydrift"
Issues = "https://github.com/SuperMarioYL/proxydrift/issues"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/proxydrift"]
